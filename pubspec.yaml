name: lgu_one
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.4+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  flutter_card_swiper: ^7.2.0
  firebase_core: ^4.9.0
  cloud_firestore: ^6.4.1
  fluttertoast: ^9.0.0
  firebase_auth: ^6.5.1
  skeletonizer: ^2.1.3
  cached_network_image: ^3.4.1
  image_picker: ^1.2.2
  firebase_storage: ^13.4.3
  intl: ^0.19.0
  crypto: ^3.0.7
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  permission_handler: ^12.0.1
  app_settings: ^5.1.1
  http: ^1.2.2
  shared_preferences: ^2.3.5
  timezone: ^0.11.0
  flutter_launcher_icons: ^0.14.4



flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/lgu_connect_icon_whitebg.jpg"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/lgu_connect_icon_whitebg.jpg"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/lgu_connect_icon_whitebg.jpg"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/lgu_connect_icon_whitebg.jpg"
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true
  assets:
    - assets/images/

